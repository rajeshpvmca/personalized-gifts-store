<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: transparent;
            padding: 2rem;
            font-family: 'Inter', sans-serif;
        }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), #1e3a8a);
            border-radius: 16px;
            color: white;
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.2);
            margin-bottom: 2rem;
            text-align: center;
        }

        .profile-header-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(223, 183, 140, 0.2) 0%, rgba(223, 183, 140, 0) 70%);
            border-radius: 50%;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #dfb78c, #c08e50);
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            margin: 0 auto 1.5rem auto;
            position: relative;
            z-index: 2;
            color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .edit-avatar-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 35px;
            height: 35px;
            background: white;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .edit-avatar-btn:hover { transform: scale(1.1); }

        .settings-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--outline-variant);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            padding: 2rem;
            height: 100%;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .form-control {
            border: 1px solid var(--outline-variant);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            color: var(--on-surface);
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(30, 58, 138, 0.1);
            background: #ffffff;
        }
        
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--outline-variant);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0">
        
        <div class="row justify-content-center">
            <div class="">
                <!-- Profile Header -->
                <div class="profile-header-card">
                    <div class="profile-avatar-large">
                        <span id="userInitials">JD</span>
                        <button onclick="window.top.location.href='../404.html'" class="edit-avatar-btn" title="Change Avatar">
                            <span class="material-symbols-outlined fs-6">photo_camera</span>
                        </button>
                    </div>
                    <h2 class="font-heading fw-bold mb-1 position-relative z-2" id="userNameDisplay">Jane Doe</h2>
                    <p class="text-white-50 font-button position-relative z-2 mb-0 d-flex justify-content-center align-items-center gap-2">
                        <span class="material-symbols-outlined fs-6">badge</span> <span id="userRoleDisplay">Administrator</span>
                    </p>
                </div>

                <div class="row g-4">
                    <!-- Personal Information -->
                    <div class="col-lg-7">
                        <div class="settings-card">
                            <h5 class="section-title d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined">person</span> Personal Information
                            </h5>
                            
                            <form>
                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <label class="form-label">First Name</label>
                                        <input type="text" class="form-control" value="Jane" id="firstNameInput">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Last Name</label>
                                        <input type="text" class="form-control" value="Doe" id="lastNameInput">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Email Address</label>
                                        <input type="email" class="form-control" value="jane.doe@example.com" readonly>
                                        <div class="form-text small">Email addresses cannot be changed directly. Contact support.</div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Phone Number</label>
                                        <input type="tel" class="form-control" placeholder="+1 (555) 000-0000">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Location / Timezone</label>
                                        <select class="form-control form-select">
                                            <option>Eastern Time (EST)</option>
                                            <option>Pacific Time (PST)</option>
                                            <option>Central Time (CST)</option>
                                            <option>London (GMT)</option>
                                        </select>
                                    </div>
                                    <div class="col-12 text-end mt-4">
                                        <button onclick="window.top.location.href='../404.html'" type="button" class="btn btn-premium btn-premium-primary rounded-pill px-4 font-button fw-bold">Update Profile</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Security & Password -->
                    <div class="col-lg-5">
                        <div class="settings-card">
                            <h5 class="section-title d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined">lock</span> Security
                            </h5>
                            
                            <form>
                                <div class="mb-4">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" class="form-control" placeholder="••••••••">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">New Password</label>
                                    <input type="password" class="form-control" placeholder="Enter new password">
                                    <div class="form-text small">Minimum 8 characters, at least 1 number and 1 symbol.</div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-control" placeholder="Confirm new password">
                                </div>
                                <div class="text-end">
                                    <button onclick="window.top.location.href='../404.html'" type="button" class="btn btn-premium btn-premium-secondary rounded-pill w-100 font-button fw-bold">Change Password</button>
                                </div>
                            </form>
                            
                            <div class="mt-5 pt-4 border-top border-outline-variant">
                                <h6 class="fw-bold text-primary mb-3">Two-Factor Authentication</h6>
                                <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded-3 border border-outline-variant">
                                    <div>
                                        <p class="mb-0 fw-bold text-dark small">Status: <span class="text-success">Enabled</span></p>
                                        <p class="mb-0 text-secondary small" style="font-size: 0.75rem;">Authenticator App (Google)</p>
                                    </div>
                                    <button onclick="window.top.location.href='../404.html'" class="btn btn-sm btn-outline-secondary font-button">Configure</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Update UI dynamically based on the current logged-in user from localStorage
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('loggedInUser');
            if (userStr) {
                const user = JSON.parse(userStr);
                
                // Set text fields
                document.getElementById('userNameDisplay').textContent = user.name;
                document.getElementById('userRoleDisplay').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
                
                // Set form fields based on name
                const nameParts = user.name.split(' ');
                document.getElementById('firstNameInput').value = nameParts[0] || '';
                document.getElementById('lastNameInput').value = nameParts[1] || '';
                
                // Generate initials
                let initials = "U";
                if (nameParts.length > 1) {
                    initials = nameParts[0].charAt(0).toUpperCase() + nameParts[1].charAt(0).toUpperCase();
                } else if (nameParts.length === 1) {
                    initials = nameParts[0].charAt(0).toUpperCase();
                }
                document.getElementById('userInitials').textContent = initials;
            }
        });
    </script>
</body>
</html>
