<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Page Not Found | Stackly</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css"/>
    
    <style>
        body {
            background-color: #f1f2f4;
        }

        .error-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: clamp(4rem, 15vw, 5rem);
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1;
            color: #636b46;
            letter-spacing: -0.02em;
        }
        
        .icon-container {
            width: 70px;
            height: 70px;
            background-color: #faf5eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .btn-custom-outline {
            background-color: #ffffff;
            border: 1px solid #111111;
            color: #111111;
            font-weight: 600;
            border-radius: 50rem;
        }
        .btn-custom-outline:hover {
            background-color: #f8f9fa;
        }

        .btn-custom-solid {
            background-color: #c99846;
            color: #073b2c;
            font-weight: 600;
            border: none;
            border-radius: 50rem;
        }
        .btn-custom-solid:hover {
            background-color: #b88a3e;
            color: #073b2c;
        }

        /* Mobile specific adjustments to ensure it works well down to 320px */
        @media (max-width: 450px) {
            .error-card {
                padding: 2.5rem 1.5rem !important;
                border-radius: 20px;
            }
            .action-buttons {
                flex-direction: column !important;
                padding: 0 1rem !important;
            }
            .action-buttons .btn {
                width: 100% !important;
                padding-top: 1rem !important;
                padding-bottom: 1rem !important;
            }
        }
    </style>
</head>
<body class="text-dark font-body-md d-flex flex-column min-vh-100 align-items-center justify-content-center p-3 p-md-4">

    <main class="w-100" style="max-width: 440px;">
        <div class="error-card p-5 text-center" data-aos="zoom-in" data-aos-duration="800">
            <div class="card-content">
                <!-- Icon -->
                <div class="icon-container mb-4" data-aos="fade-down" data-aos-delay="100">
                    <span class="material-symbols-outlined" style="font-size: 2rem; color: #c19b48;">
                        search_off
                    </span>
                </div>

                <!-- 404 Text -->
                <h1 class="error-code mb-3" data-aos="fade-down" data-aos-delay="200">404</h1>
                
                <!-- Heading -->
                <h2 class="h3 mb-4 fw-bold" style="color: #1f2937; font-family: var(--font-heading);" data-aos="fade-up" data-aos-delay="300">
                    Looks like you're lost.
                </h2>
                
                <!-- Description -->
                <p class="mb-5 mx-auto" style="color: #6b7280; font-size: 1rem; line-height: 1.6;" data-aos="fade-up" data-aos-delay="400">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
                </p>
                
                <!-- Buttons -->
                <div class="action-buttons d-flex flex-column gap-4 px-2" data-aos="fade-up" data-aos-delay="500">
                    <button onclick="history.back()" class="btn btn-custom-outline px-4 py-3 d-inline-flex align-items-center justify-content-center gap-2 transition-lift shadow-sm">
                        <span class="material-symbols-outlined fs-5">arrow_back</span>
                        Go Back
                    </button>
                    <a href="index.html" class="btn btn-custom-solid px-4 py-3 d-inline-flex align-items-center justify-content-center gap-2 transition-lift shadow-sm text-decoration-none">
                        <span class="material-symbols-outlined fs-5">home</span>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Subtle Brand Text outside card -->
        <div class="text-center mt-5" data-aos="fade-in" data-aos-delay="800">
            <p style="font-size: 1.05rem; color: #6b7280; font-family: var(--font-heading);">
                &copy; Stackly Handcrafted Gifting
            </p>
        </div>
    </main>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Initialize AOS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof AOS !== 'undefined') {
                AOS.init({
                    once: true,
                    offset: 50,
                    duration: 800
                });
            }
        });
    </script>
</body>
</html>
