<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Page Not Found | Stackly</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css"/>
    
    <style>
        body {
            /* Create a beautiful soft background */
            background: linear-gradient(135deg, rgba(249,247,243,1) 0%, rgba(229,231,235,0.6) 100%);
        }

        .error-card {
            background-color: var(--color-surface);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(6, 78, 59, 0.08), 0 0 0 1px rgba(6, 78, 59, 0.03);
            position: relative;
            overflow: hidden;
        }

        /* Decorative gradient blob inside the card */
        .error-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: clamp(5rem, 15vw, 9rem);
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.95;
            letter-spacing: -0.05em;
        }
        
        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* Mobile specific adjustments to ensure it works well down to 320px */
        @media (max-width: 400px) {
            .btn-mobile-full {
                width: 100% !important;
                margin-bottom: 0.75rem;
            }
            .error-card {
                padding: 1.5rem !important;
                border-radius: 16px;
            }
            .icon-container {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body class="text-dark font-body-md d-flex flex-column min-vh-100 align-items-center justify-content-center p-3 p-md-4">

    <main class="w-100" style="max-width: 650px;">
        <div class="error-card p-4 p-md-5 text-center" data-aos="zoom-in" data-aos-duration="800">
            <div class="card-content">
                <!-- Icon -->
                <div class="icon-container mb-4" data-aos="fade-down" data-aos-delay="100">
                    <span class="material-symbols-outlined" style="font-size: clamp(2rem, 8vw, 3rem); color: var(--color-secondary);">
                        search_off
                    </span>
                </div>

                <!-- 404 Text -->
                <h1 class="error-code mb-2" data-aos="fade-down" data-aos-delay="200">404</h1>
                
                <!-- Heading -->
                <h2 class="h4 mb-3 fw-bold" style="color: var(--color-text-main);" data-aos="fade-up" data-aos-delay="300">
                    Looks like you're lost.
                </h2>
                
                <!-- Description -->
                <p class="mb-5 mx-auto" style="color: var(--color-text-muted); font-size: clamp(0.9rem, 3vw, 1.05rem); max-width: 450px;" data-aos="fade-up" data-aos-delay="400">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
                </p>
                
                <!-- Buttons -->
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 px-2 px-sm-0" data-aos="fade-up" data-aos-delay="500">
                    <button onclick="history.back()" class="btn btn-outline-dark rounded-pill px-5 py-3 d-inline-flex align-items-center justify-content-center gap-2 fw-bold transition-lift w-100 w-sm-auto btn-mobile-full shadow-sm">
                        <span class="material-symbols-outlined fs-5">arrow_back</span>
                        Go Back
                    </button>
                    <a href="index.html" class="btn rounded-pill px-5 py-3 d-inline-flex align-items-center justify-content-center gap-2 fw-bold transition-lift w-100 w-sm-auto btn-mobile-full shadow-sm" style="background: linear-gradient(45deg, #dfb162, #c18a39); color: #064e3b; border: none; text-decoration: none;">
                        <span class="material-symbols-outlined fs-5">home</span>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Subtle Brand Text outside card -->
        <div class="text-center mt-4" data-aos="fade-in" data-aos-delay="800">
            <p style="font-size: 0.85rem; color: var(--color-text-muted); font-family: var(--font-heading);">
                &copy; Stackly Handcrafted Gifting
            </p>
        </div>
    </main>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Initialize AOS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof AOS !== 'undefined') {
                AOS.init({
                    once: true,
                    offset: 50,
                    duration: 800
                });
            }
        });
    </script>
</body>
</html>
