<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Page Not Found | Stackly</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css"/>
    
    <style>
        body {
            background-color: #f1f2f4;
        }

        .error-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: clamp(4rem, 15vw, 5rem);
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1;
            color: #636b46;
            letter-spacing: -0.02em;
        }
        
        .icon-container {
            width: 70px;
            height: 70px;
            background-color: #faf5eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .btn-custom-outline {
            background-color: #ffffff;
            border: 1px solid #111111;
            color: #111111;
            font-weight: 600;
            border-radius: 50rem;
        }
        .btn-custom-outline:hover {
            background-color: #f8f9fa;
        }

        .btn-custom-solid {
            background-color: #c99846;
            color: #073b2c;
            font-weight: 600;
            border: none;
            border-radius: 50rem;
        }
        .btn-custom-solid:hover {
            background-color: #b88a3e;
            color: #073b2c;
        }

        /* Dancing Background Icons */
        .bg-icon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bg-icon {
            position: absolute;
            color: #c18a39; /* Gold */
            opacity: 0.15;
            animation: floatDance 6s ease-in-out infinite;
        }

        @keyframes floatDance {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            33% { transform: translateY(-25px) rotate(15deg) scale(1.1); }
            66% { transform: translateY(10px) rotate(-10deg) scale(0.95); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        /* Specific positions and animation variations */
        .icon-1 { top: 15%; left: 10%; font-size: 4rem; animation-delay: 0s; animation-duration: 7s; }
        .icon-2 { top: 60%; left: 5%; font-size: 5rem; animation-delay: 1.5s; animation-duration: 8s; color: #064e3b; /* Green */ }
        .icon-3 { top: 20%; right: 15%; font-size: 3.5rem; animation-delay: 3s; animation-duration: 6s; }
        .icon-4 { top: 70%; right: 10%; font-size: 4.5rem; animation-delay: 0.5s; animation-duration: 9s; color: #064e3b; }
        .icon-5 { top: 40%; left: 80%; font-size: 3rem; animation-delay: 2s; animation-duration: 7.5s; }
        .icon-6 { top: 85%; left: 40%; font-size: 4rem; animation-delay: 4s; animation-duration: 8.5s; color: #064e3b; }

        /* Mobile specific adjustments to ensure it works well down to 320px */
        @media (max-width: 450px) {
            .error-card {
                padding: 2.5rem 1.5rem !important;
                border-radius: 20px;
            }
            .action-buttons {
                flex-direction: column !important;
                padding: 0 1rem !important;
            }
            .action-buttons .btn {
                width: 100% !important;
                padding-top: 1rem !important;
                padding-bottom: 1rem !important;
            }
            
            /* Background icon mobile tweaks */
            .bg-icon { opacity: 0.08; } /* Lower opacity on mobile */
            .icon-1 { top: 5%; left: 5%; font-size: 3rem; }
            .icon-2 { top: 75%; left: -5%; font-size: 3.5rem; }
            .icon-3 { top: 8%; right: 5%; font-size: 2.5rem; }
            .icon-4 { top: 80%; right: -5%; font-size: 4rem; }
            .icon-5 { display: none; } /* Hide extra icons to avoid clutter */
            .icon-6 { display: none; }
        }
    </style>
</head>
<body class="text-dark font-body-md d-flex flex-column min-vh-100 align-items-center justify-content-center p-3 p-md-4 position-relative overflow-hidden">

    <!-- Dancing Background Icons -->
    <div class="bg-icon-container">
        <span class="material-symbols-outlined bg-icon icon-1">redeem</span> <!-- Gift -->
        <span class="material-symbols-outlined bg-icon icon-2">celebration</span> <!-- Party/Cheers -->
        <span class="material-symbols-outlined bg-icon icon-3">loyalty</span> <!-- Tag with Heart -->
        <span class="material-symbols-outlined bg-icon icon-4">stars</span> <!-- Star -->
        <span class="material-symbols-outlined bg-icon icon-5">favorite</span> <!-- Heart -->
        <span class="material-symbols-outlined bg-icon icon-6">volunteer_activism</span> <!-- Giving Hand -->
    </div>

    <main class="w-100 position-relative z-1" style="max-width: 440px;">
        <div class="error-card p-5 text-center" data-aos="zoom-in" data-aos-duration="800">
            <div class="card-content">
                <!-- Icon -->
                <div class="icon-container mb-4" data-aos="fade-down" data-aos-delay="100">
                    <span class="material-symbols-outlined" style="font-size: 2rem; color: #c19b48;">
                        search_off
                    </span>
                </div>

                <!-- 404 Text -->
                <h1 class="error-code mb-3" data-aos="fade-down" data-aos-delay="200">404</h1>
                
                <!-- Heading -->
                <h2 class="h3 mb-4 fw-bold" style="color: #1f2937; font-family: var(--font-heading);" data-aos="fade-up" data-aos-delay="300">
                    Looks like you're lost.
                </h2>
                
                <!-- Description -->
                <p class="mb-5 mx-auto" style="color: #6b7280; font-size: 1rem; line-height: 1.6;" data-aos="fade-up" data-aos-delay="400">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
                </p>
                
                <!-- Buttons -->
                <div class="action-buttons d-flex flex-column gap-4 px-2" data-aos="fade-up" data-aos-delay="500">
                    <button onclick="history.back()" class="btn btn-custom-outline px-4 py-3 d-inline-flex align-items-center justify-content-center gap-2 transition-lift shadow-sm">
                        <span class="material-symbols-outlined fs-5">arrow_back</span>
                        Go Back
                    </button>
                    <a href="index.html" class="btn btn-custom-solid px-4 py-3 d-inline-flex align-items-center justify-content-center gap-2 transition-lift shadow-sm text-decoration-none">
                        <span class="material-symbols-outlined fs-5">home</span>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    
    </main>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Initialize AOS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof AOS !== 'undefined') {
                AOS.init({
                    once: true,
                    offset: 50,
                    duration: 800
                });
            }
        });
    </script>
</body>
</html>
