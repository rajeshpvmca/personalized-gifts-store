<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Dashboards</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        :root {
            --sidebar-width: 280px;
            --header-height: 80px;
        }

        body {
            overflow: hidden; 
            background-color: var(--background);
        }

        /* Sidebar Styling (Premium Glass & White) */
        .dash-sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #ffffff;
            z-index: 1050;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--outline-variant);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.03);
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid var(--outline-variant);
            justify-content: center;
        }
        
        .sidebar-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--outline-variant) transparent;
        }

        .sidebar-nav::-webkit-scrollbar { width: 5px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 10px; }

        .nav-item-dash {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            color: var(--on-surface-variant);
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .nav-item-dash:hover {
            color: var(--primary);
            background: var(--surface-variant);
            transform: translateX(5px);
        }

        .nav-item-dash.active {
            color: #ffffff;
            background: var(--primary);
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(26, 54, 93, 0.2);
            transform: translateX(5px);
        }
        
        .nav-section-title {
            color: var(--on-surface-variant);
            opacity: 0.6;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 0 18px;
            margin-bottom: 12px;
            margin-top: 15px;
        }

        /* Main Content Styling */
        .dash-main {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            background-color: var(--background);
        }

        .dash-header {
            height: var(--header-height);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1px solid var(--outline-variant);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        #dashFrame {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: calc(100vh - var(--header-height));
            background-color: transparent;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--secondary-container);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(184, 151, 116, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .user-avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(184, 151, 116, 0.5);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26, 54, 93, 0.4);
            backdrop-filter: blur(5px);
            z-index: 1040;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        @media (max-width: 991.98px) {
            .dash-sidebar { transform: translateX(-100%); }
            .dash-sidebar.active { transform: translateX(0); }
            .dash-main { margin-left: 0; width: 100%; }
            #sidebarToggle { 
                display: flex !important; 
                align-items: center; 
                justify-content: center; 
                width: 40px; 
                height: 40px; 
                border-radius: 8px; 
                background: var(--surface-variant); 
                border: 1px solid var(--outline-variant); 
                color: var(--primary); 
            }
        }

        @media (max-width: 575.98px) {
            .dash-header { padding: 0 1rem; }
            #navUserName, #navUserEmail { display: none; }
            .dash-header h4 { font-size: 0.9rem !important; }
            #roleBadge { font-size: 0.6rem !important; padding: 0.25em 0.5em !important; }
            .user-avatar { width: 36px; height: 36px; font-size: 1rem; }
            #signoutBtn { padding: 0.5rem 1rem !important; font-size: 0.8rem !important; }
            #signoutBtn .material-symbols-outlined { font-size: 1.1rem !important; margin-right: 0 !important; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="dash-sidebar" id="dashSidebar">
        <div class="sidebar-header">
            
            <div style="-webkit-mask: url('../assets/images/logoStackly.webp') no-repeat center left; -webkit-mask-size: contain; mask: url('../assets/images/logoStackly.webp') no-repeat center left; mask-size: contain; background-color: var(--primary); width: 150px; height: 40px;" aria-label="Stackly Logo"></div>
        </div>
        
        <div class="sidebar-nav">
            <!-- Customer Navigation (5 Pages) -->
            <div id="navCustomer" style="display:none">
                <p class="nav-section-title">Customer Portal</p>
            </div>

            <!-- Artisan Navigation (5 Pages) -->
            <div id="navArtisan" style="display:none">
                <p class="nav-section-title">Artisan Workspace</p>
            </div>

            <!-- Admin Navigation (5 Pages) -->
            <div id="navAdmin" style="display:none">
                <p class="nav-section-title">System Admin</p>
            </div>

            <p class="nav-section-title" style="margin-top: 30px;">Settings</p>
            <a href="dashboard/profile.html" class="nav-item-dash" data-page="profile"><span class="material-symbols-outlined">person</span> My Profile</a>
            <a href="dashboard/settings.html" class="nav-item-dash" data-page="settings"><span class="material-symbols-outlined">settings</span> Settings</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="dash-main">
        <header class="dash-header">
            <div class="d-flex align-items-center gap-3">
                <button onclick="window.top.location.href='404.html'" class="btn btn-light d-lg-none p-2 d-flex align-items-center justify-content-center" id="sidebarToggle">
                    <span class="material-symbols-outlined text-primary">menu</span>
                </button>
                <div class="d-flex flex-column">
                    <h4 class="mb-0 font-heading fw-bold text-primary" style="font-size: 1.2rem;">Workspace</h4>
                    <span class="badge mt-1" style="width: fit-content; background: var(--surface-variant); color: var(--on-surface-variant); border: 1px solid var(--outline-variant); font-family: 'Inter', sans-serif;" id="roleBadge">ROLE</span>
                </div>
            </div>

            <div class="d-flex align-items-center gap-4">
                <div class="text-end d-none d-sm-block">
                    <div class="fw-bold text-primary" id="navUserName" style="font-family: 'Inter', sans-serif;">User Name</div>
                    <div class="text-secondary small" id="navUserEmail">email@example.com</div>
                </div>
                <div class="d-flex align-items-center gap-3 border-start ps-3" style="border-color: var(--outline-variant) !important;">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <button onclick="window.top.location.href='404.html'" class="btn btn-premium btn-premium-primary rounded-pill px-4 py-2 fw-bold d-flex align-items-center gap-2 shadow-sm" id="signoutBtn" style="font-size: 0.85rem;">
                        <span class="material-symbols-outlined" style="font-size: 1.1rem;">logout</span> <span class="d-none d-md-inline">Sign Out</span>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Default iframe routes to 404 until javascript sets the correct page based on role -->
        <iframe src="404.html" id="dashFrame"></iframe>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
